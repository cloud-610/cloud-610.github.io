<!DOCTYPE html>
<!-- 声明文档类型为HTML5 -->
<html lang="zh-CN"> <!-- 增加语言属性，更符合规范 -->
	<head>
		<meta charset="UTF-8">
		<!-- 设置字符编码为UTF-8，避免中文乱码 -->
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<!-- 适配移动端，让页面在手机上正常显示 -->
		<title>我的个人网站</title>
		<style>
			/* 简单的样式美化，让页面不那么单调 */
			body {
				font-family: "Microsoft YaHei", sans-serif; /* 中文友好字体 */
				max-width: 800px; /* 限制页面宽度 */
				margin: 50px auto; /* 页面居中，上下留间距 */
				padding: 0 20px; /* 左右内边距 */
				background-color: #f5f5f5; /* 浅灰色背景 */
			}
			h1 {
				color: #2c3e50; /* 深蓝色标题 */
				border-bottom: 2px solid #3498db; /* 标题下划线 */
				padding-bottom: 10px;
			}
			p {
				font-size: 16px;
				color: #34495e; /* 深灰色文本 */
				line-height: 1.6; /* 行高更易读 */
			}
		</style>
	</head>
	<body>
		<h1>欢迎来到我的小站</h1>
		<p>这是通过 GitHub Pages 搭建的（不知道放啥了）</p>
	</body>
</html>
